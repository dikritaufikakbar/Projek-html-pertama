
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>
    <link rel="stylesheet" href="kalkulator.css">
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" value="0" readonly>

        <div class="buttons">
            <button class="clear" onclick="hapusSemua()">C</button>
            <button class="delete" onclick="hapusSatu()">⌫</button>
            <button class="operator" onclick="persen()">%</button>
            <button class="operator" onclick="pilihOperator('/')">÷</button>

            <button onclick="masukkan('7')">7</button>
            <button onclick="masukkan('8')">8</button>
            <button onclick="masukkan('9')">9</button>
            <button class="operator" onclick="pilihOperator('*')">×</button>

            <button onclick="masukkan('4')">4</button>
            <button onclick="masukkan('5')">5</button>
            <button onclick="masukkan('6')">6</button>
            <button class="operator" onclick="pilihOperator('-')">−</button>

            <button onclick="masukkan('1')">1</button>
            <button onclick="masukkan('2')">2</button>
            <button onclick="masukkan('3')">3</button>
            <button class="operator" onclick="pilihOperator('+')">+</button>

            <button class="nol" onclick="masukkan('0')">0</button>
            <button onclick="masukkan('.')">.</button>
            <button class="hasil" onclick="hitung()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById("display");

        let angkaPertama = null;
        let operator = null;
        let angkaBaru = false;

        function masukkan(angka) {
            if (display.value === "Error") {
                display.value = "0";
            }

            if (angkaBaru) {
                display.value = angka === "." ? "0." : angka;
                angkaBaru = false;
                return;
            }

            if (angka === "." && display.value.includes(".")) return;

            if (display.value === "0" && angka !== ".") {
                display.value = angka;
            } else {
                display.value += angka;
            }
        }

        function pilihOperator(op) {
            if (display.value === "Error") return;

            if (operator !== null && !angkaBaru) {
                hitung();
            }

            angkaPertama = parseFloat(display.value);
            operator = op;
            angkaBaru = true;
        }

        function hitung() {
            if (operator === null || angkaPertama === null) return;

            const angkaKedua = parseFloat(display.value);
            let hasil;

            switch (operator) {
                case "+": hasil = angkaPertama + angkaKedua; break;
                case "-": hasil = angkaPertama - angkaKedua; break;
                case "*": hasil = angkaPertama * angkaKedua; break;
                case "/":
                    hasil = angkaKedua === 0
                        ? NaN
                        : angkaPertama / angkaKedua;
                    break;
            }

            display.value = Number.isFinite(hasil)
                ? String(Number(hasil.toPrecision(12)))
                : "Error";

            angkaPertama = null;
            operator = null;
            angkaBaru = true;
        }

        function hapusSemua() {
            display.value = "0";
            angkaPertama = null;
            operator = null;
            angkaBaru = false;
        }

        function hapusSatu() {
            if (display.value === "Error" || angkaBaru) {
                display.value = "0";
                angkaBaru = false;
                return;
            }

            display.value = display.value.length > 1
                ? display.value.slice(0, -1)
                : "0";
        }

        function persen() {
            if (display.value !== "Error") {
                display.value = String(parseFloat(display.value) / 100);
                angkaBaru = true;
            }
        }
    </script>

</body>
</html>
