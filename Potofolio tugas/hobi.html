
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobi</title>

    <style>
        .kotak {
            border: 2px solid #666;
            padding: 20px;
            width: 650px;
            max-width: 90%;
            margin: 20px auto;
            box-sizing: border-box;
        }

        h1 {
            font-size: 48px;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        p {
            font-size: 30px;
        }

        ul {
            font-size: 30px;
            margin-left: 25px;
            margin-bottom: 65px;
        }

        h2 {
            font-size: 42px;
            margin-bottom: 55px;
        }

        ol {
            font-size: 30px;
            list-style-type: upper-alpha;
            margin-left: 35px;
        }

        @media (max-width: 600px) {
            .kotak {
                width: 95%;
                padding: 15px;
            }

            h1 {
                font-size: 38px;
            }

            p, ul, ol {
                font-size: 24px;
            }

            h2 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="kotak">

        <h1>Hobi</h1>

        <p>Beberapa hobi saya adalah:</p>

        <ul>
            <li>Membaca</li>
            <li>Jalan Jalan</li>
            <li>Bermain game</li>
            <li>Fotografi</li>
        </ul>

        <h2>Urutan Hobi Favorit</h2>

        <ol>
            <li>Programming</li>
            <li>Gaming</li>
            <li>streaming</li>
            <li>Traveling</li>
        </ol>

    </div>

</body>
</html>
